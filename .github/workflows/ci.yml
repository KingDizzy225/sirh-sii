name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntaxe, dépendances & schéma Prisma
    runs-on: ubuntu-latest

    # Base jetable pour l'essai d'intégration de la paie. Les contrôles
    # statiques ne pouvaient pas voir que le net retranchait la part patronale
    # ni que l'export comptable échouait à chaque appel : les deux étaient
    # syntaxiquement corrects.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sirh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Vérification de la syntaxe de tous les fichiers serveur
        run: find server -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Installation des dépendances serveur
        working-directory: server
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npm ci

      - name: Validation du schéma Prisma
        working-directory: server
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npx prisma validate

      - name: Cohérence des routes frontend / serveur
        run: node scripts/check-routes.cjs

      - name: Cohérence des champs écrits et du schéma Prisma
        run: node scripts/check-schema-usage.cjs

      - name: Application des migrations sur une base vierge
        working-directory: server
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/sirh_test"
        run: npx prisma migrate deploy

      - name: Essai d'intégration de la paie
        working-directory: server
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/sirh_test"
        run: npm run test:paie

  frontend:
    name: Frontend — build Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Règles des hooks React
        run: npx eslint src --config eslint.hooks.config.js

      - name: Build de production
        run: npm run build
