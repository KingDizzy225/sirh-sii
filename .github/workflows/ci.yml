name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntaxe, dépendances & schéma Prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Vérification de la syntaxe de tous les fichiers serveur
        run: find server -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Installation des dépendances serveur
        working-directory: server
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npm ci

      - name: Validation du schéma Prisma
        working-directory: server
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npx prisma validate

  frontend:
    name: Frontend — build Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npm run build
